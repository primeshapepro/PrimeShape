name: Deploy GitHub Pages

on:
  push:
    branches: [main, claude/relaxed-franklin-7i4g13]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html 404.html avis.json robots.txt sitemap.xml .nojekyll \
            favicon.ico favicon.svg apple-touch-icon.png og-image.jpg \
            assets fonts media merci cgu confidentialite mentions-legales _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
